[package]
name = "consort-app"
description = "Consort desktop client."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The installed command is `consort`, not `consort-app`. Tauri's own guidance is
# to set this rather than `mainBinaryName`, so that plain `cargo build` and
# `tauri build` agree on the filename. Distro packaging cares: the GTK WM_CLASS
# is derived from argv[0], so a binary installed under a different name than the
# one the .desktop file declares gets a blank icon in the dock.
[[bin]]
name = "consort"
path = "src/main.rs"

[lib]
# Tauri v2 keeps the app in a lib so the mobile targets can link it. Desktop
# `main.rs` is a three-line shim over `run()`.
name = "consort_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# DO NOT REMOVE. tauri's build script computes `dev = !custom_protocol`, so
# without this feature even a --release binary is a dev build: it ignores the
# embedded frontendDist and tries to load devUrl (http://localhost:1420), then
# renders "Could not connect to localhost: Connection refused".
#
# The tauri CLI passes `--features tauri/custom-protocol`, enabling the
# dependency feature directly rather than this one, so `tauri build` was always
# correct and the deb and rpm were never affected. Anything driving cargo
# itself, the AUR PKGBUILD included, has to ask for it.
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
consort-audio = { path = "../../crates/consort-audio" }
# Brings libwebrtc, and so several minutes of build the first time. It is the
# reason `consort-call` is a crate of its own rather than part of
# `consort-matrix`: only this binary pays for it.
consort-call = { path = "../../crates/consort-call" }
consort-matrix = { path = "../../crates/consort-matrix" }
tauri = { version = "2", features = [] }
# For the attachment scheme's URLs. The handle a message carries is JSON, and a
# path cannot hold quotes and braces as themselves.
base64 = "0.22"
# One Consort per machine. Two would share one SQLite crypto store and one
# session file, and the cross-process lock means the second simply fails. See
# the comment at the plugin registration in lib.rs.
tauri-plugin-single-instance = "2"
# The native Save As window, for writing an attachment somewhere. Called from
# Rust only, so the webview gains no capability from it: the frontend still
# cannot reach the filesystem, and asking to save is a command like any other.
#
# The GTK dialog, and not the `xdg-portal` one, however much nicer the portal
# window is. That feature turns on `rfd/tokio`, which turns on `ashpd/tokio`,
# which turns on `zbus/tokio`. zbus is one crate in this graph and the keyring
# is the other thing in it: `keyring` reaches Secret Service through zbus's
# blocking API, and with `zbus/tokio` on, that API drives the connection by
# calling `block_on` on a tokio runtime. Reading the session is an async
# command, so the call arrives already inside one, and tokio answers
# "Cannot start a runtime from within a runtime" before the window is drawn.
tauri-plugin-dialog = { version = "2", default-features = false, features = ["gtk3"] }
# Handing a link to the desktop's browser. Called from Rust only, like the
# dialog above: the frontend still cannot reach anything outside the webview,
# and asking for a link to be opened is a command like any other. What decides
# whether it may be opened is `checked_link`, not this.
open = "5"
# For that decision. Reading a scheme means parsing the address rather than
# looking at the start of it, and this is already in the graph under
# matrix-sdk, so naming it costs nothing to build.
url = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"
# The mock runtime, so the one thing in `events.rs` that needs a real
# `AppHandle` is covered by a test rather than by the fact that it compiles.
# Dev-only: resolver 3 keeps the feature out of `cargo build`.
tauri = { version = "2", features = ["test"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
# MatrixMockServer, so the login and restore commands are exercised against
# something that answers like a homeserver. Dev-only: resolver 3 keeps the
# `testing` feature out of `cargo build`.
matrix-sdk = { workspace = true, features = ["testing"] }
wiremock = "0.6"
