[package]
name = "consort-app"
description = "Consort desktop client."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# Tauri v2 keeps the app in a lib so the mobile targets can link it. Desktop
# `main.rs` is a three-line shim over `run()`.
name = "consort_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
consort-matrix = { path = "../../crates/consort-matrix" }
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
