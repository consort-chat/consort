[package]
name = "consort-app"
description = "Consort desktop client."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The installed command is `consort`, not `consort-app`. Tauri's own guidance is
# to set this rather than `mainBinaryName`, so that plain `cargo build` and
# `tauri build` agree on the filename. Distro packaging cares: the GTK WM_CLASS
# is derived from argv[0], so a binary installed under a different name than the
# one the .desktop file declares gets a blank icon in the dock.
[[bin]]
name = "consort"
path = "src/main.rs"

[lib]
# Tauri v2 keeps the app in a lib so the mobile targets can link it. Desktop
# `main.rs` is a three-line shim over `run()`.
name = "consort_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# DO NOT REMOVE. tauri's build script computes `dev = !custom_protocol`, so
# without this feature even a --release binary is a dev build: it ignores the
# embedded frontendDist and tries to load devUrl (http://localhost:1420), then
# renders "Could not connect to localhost: Connection refused".
#
# The tauri CLI passes `--features tauri/custom-protocol`, enabling the
# dependency feature directly rather than this one, so `tauri build` was always
# correct and the deb and rpm were never affected. Anything driving cargo
# itself, the AUR PKGBUILD included, has to ask for it.
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
consort-matrix = { path = "../../crates/consort-matrix" }
tauri = { version = "2", features = [] }
# One Consort per machine. Two would share one SQLite crypto store and one
# session file, and the cross-process lock means the second simply fails. See
# the comment at the plugin registration in lib.rs.
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"
# The mock runtime, so the one thing in `events.rs` that needs a real
# `AppHandle` is covered by a test rather than by the fact that it compiles.
# Dev-only: resolver 3 keeps the feature out of `cargo build`.
tauri = { version = "2", features = ["test"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
# MatrixMockServer, so the login and restore commands are exercised against
# something that answers like a homeserver. Dev-only: resolver 3 keeps the
# `testing` feature out of `cargo build`.
matrix-sdk = { workspace = true, features = ["testing"] }
wiremock = "0.6"
