<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B4BE8"/>
      <stop offset="0.55" stop-color="#4232C4"/>
      <stop offset="1" stop-color="#2A1F8A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>

  <!-- The C: an open arc, left off at the right so the level bars sit in the gap -->
  <path d="M 330 150 A 118 118 0 1 0 330 362"
        fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round"/>

  <!-- Voice level bars in the opening of the C -->
  <g fill="#8FE3C2">
    <rect x="330" y="228" width="26" height="56" rx="13"/>
    <rect x="374" y="196" width="26" height="120" rx="13"/>
    <rect x="418" y="222" width="26" height="68" rx="13"/>
  </g>
</svg>
