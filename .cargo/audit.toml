# What `cargo audit` is allowed to pass over. An entry is a decision to accept a
# risk, not a way to quiet a build: docs/DEPENDENCIES.md#advisories has the
# argument for each, the order to try before adding one, and what lifts it.

[advisories]
ignore = [
  # Uninitialized memory out of the C SQLite libsqlite3-sys bundles.
  "RUSTSEC-2026-0459",

  # Four extraction flaws in `zip` 4.6.1, under tauri-plugin-updater.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
  "RUSTSEC-2026-0429",
]
