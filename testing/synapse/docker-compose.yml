# A Synapse to throw away.
#
# Not a deployment. It exists so the verification work has two real accounts on
# one homeserver to run a real olm handshake between, which no mock can do.
# Everything here is chosen for being disposable: no reverse proxy, no TLS, no
# Postgres, and the whole state directory is deleted by `down.sh`.
#
# Never point this at anything real, and never reuse these passwords.

services:
  synapse:
    # Floating on purpose for now. Pin it to a known-good tag once the
    # verification tests have been green against one for a while; a moving
    # homeserver under a test suite is a source of failures nobody changed.
    image: ${SYNAPSE_IMAGE:-ghcr.io/element-hq/synapse:latest}
    container_name: consort-test-synapse
    environment:
      SYNAPSE_SERVER_NAME: consort.test
      SYNAPSE_REPORT_STATS: "no"
      UID: "1000"
      GID: "1000"
    volumes:
      - ./data:/data
    # Bound to the loopback address rather than every interface. Registration
    # on this server is open to anyone who can reach it.
    ports:
      - "127.0.0.1:8008:8008"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS http://localhost:8008/health || exit 1"
      interval: 2s
      timeout: 2s
      retries: 30
