# What the Release button does.
#
# Run it from the Actions tab with the tag box left empty and it releases what
# is on `main`: git-cliff reads the commits since the last tag and names the
# next version, `scripts/set-version.sh` writes that into the seven files that
# carry one, the changelog is regenerated, and the commit and the annotated tag
# are pushed. Three builds then hang off the release page: a Windows installer,
# a .deb for Debian and Ubuntu, and a package for Arch.
#
# Nobody picks the version and nobody runs anything locally. A `feat` moves the
# minor, a `fix` moves the patch, a `!` or a `BREAKING CHANGE:` footer moves the
# major, which is the whole reason CONTRIBUTING.md asks for the commit messages
# it does.
#
# ## Why the bump is a job in this file rather than a workflow of its own
#
# Because a push made with `GITHUB_TOKEN` does not trigger another workflow. A
# separate bump workflow would push the tag and nothing would happen: no notes,
# no packages, no error. Everything that has to follow a tag therefore has to
# be in the same run as the thing that writes it, which is what the `needs:`
# below are doing.
#
# For the same reason, the `chore(release):` commit this pushes gets no CI run
# of its own. That is not a gap: the gate below is on the commit being
# released, which is a merge somebody's pull request already took through CI.
#
# ## Who gets credited
#
# The notes name whoever wrote each change and welcome anybody contributing for
# the first time. Both come from git-cliff asking GitHub about the commits, not
# from `gh release create --generate-notes`, which is GitHub's own generator and
# never runs when notes are handed to it in a file. cliff.toml carries the
# template and the reasoning; the two steps below that mention attribution are
# there because a GitHub that does not answer produces notes crediting nobody
# and exits 0.
#
# ## Backfilling
#
# Putting an existing tag in the box skips the bump and gives that tag its
# notes and its packages, which is how a release made before this file existed
# is filled in. The notes step is idempotent for the same reason: it adds a
# release when there is none and leaves an existing one alone.
#
# ## Pushing to main
#
# This works because `main` carries no branch protection and no ruleset. Adding
# either means giving this workflow a deploy key or a GitHub App token, because
# `GITHUB_TOKEN` cannot push past a protected branch.
#
# ## Cost
#
# Free, and only because every runner here is standard and the repository is
# public. A larger runner is billed on a public repository like any other, so
# no job may move to one.
#
# ## Nothing here is signed
#
# Windows SmartScreen will warn about the installer on first run, and there is
# no way around that short of a code-signing certificate. The two Linux
# packages are unsigned in the same sense: no repository serves them and no key
# vouches for them. The README says so where somebody downloading them will
# read it.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Leave empty to release what is on main. An existing tag here backfills that release instead.
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3
  RUSTUP_MAX_RETRIES: 3

permissions:
  contents: write
  # `gh run list`, for the CI gate below.
  actions: read
  # The update manifest, which GitHub Pages serves. Why Pages and not the
  # release page: docs/PLAN-self-update.md.
  pages: write
  id-token: write

# One release at a time, and never cancelled: a run interrupted between the
# commit and the tag leaves main carrying a version that was never released.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version and notes
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: What this run is for
        id: mode
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            echo "Backfilling $INPUT_TAG."
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "ref=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = push ]; then
            echo "$REF_NAME was pushed."
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "ref=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing what is on main."
            echo "bump=true" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.mode.outputs.ref }}
          # git-cliff reads the whole history and every tag, both to work out
          # where this release starts and to name the next version. A shallow
          # clone gives it one commit and it writes an empty changelog rather
          # than failing.
          fetch-depth: 0

      # The published binary rather than an action wrapping it, pinned by
      # version and checked against the checksum the release publishes. One
      # fewer third party with a step in this workflow.
      - name: Install git-cliff
        env:
          CLIFF: 2.14.1
          SHA512: bb40f68e752db1a32526c43e0108e8eff785f7c24c67024cffe1c316e034372975fd78c9af8e9a48148235aad15c9a103f1a5b490c282f1db09a7a793794b69f
        run: |
          set -euo pipefail
          archive="git-cliff-${CLIFF}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL --retry 3 \
            "https://github.com/orhun/git-cliff/releases/download/v${CLIFF}/${archive}" \
            -o "$archive"
          echo "${SHA512}  ${archive}" | sha512sum --check --strict
          tar -xzf "$archive"
          sudo install "git-cliff-${CLIFF}/git-cliff" /usr/local/bin/git-cliff

      # Before the CI gate, so that a run with nothing releasable in it says so
      # rather than complaining about a commit it was never going to tag.
      - name: Which version comes next
        id: bump
        if: steps.mode.outputs.bump == 'true'
        env:
          # git-cliff asks GitHub who wrote each commit whenever cliff.toml
          # names a remote, which is every invocation in this file and this one
          # too. Unauthenticated works and is capped at 60 requests an hour for
          # the whole runner address, so the token is here for headroom rather
          # than for access.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(git cliff --bumped-version)
          case "$tag" in
            v[0-9]*) ;;
            *)
              echo "git-cliff would not name a version. Got '$tag'." >&2
              exit 1
              ;;
          esac
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists, so there is nothing releasable since the" >&2
            echo "last tag. Only feat, fix, perf, refactor and docs commits count;" >&2
            echo "cliff.toml says which." >&2
            exit 1
          fi
          echo "The next release is $tag."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Whoever ran the release script used to be the one who had looked at CI
      # first. Nobody runs it now, so this is that person.
      - name: CI is green on the commit being released
        if: steps.mode.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          state=$(gh run list --workflow ci.yml --commit "$sha" \
            --json status,conclusion --limit 20 \
            --jq '[.[]] | first | "\(.status // "none") \(.conclusion // "none")"')
          case "${state:-}" in
            "completed success")
              echo "CI passed on $sha."
              ;;
            ""|"none none")
              echo "No CI run for $sha. Push something to main, or wait for the" >&2
              echo "run on it to start." >&2
              exit 1
              ;;
            *)
              echo "The newest CI run for $sha is '$state'. Not releasing it." >&2
              exit 1
              ;;
          esac

      # Attribution fails by being absent. Every handle in cliff.toml sits
      # inside an `{% if %}`, so GitHub not answering produces notes that
      # render cleanly, credit nobody, and exit 0, which is the one outcome
      # this is all here to prevent. `--offline` and GIT_CLIFF_OFFLINE do it
      # silently; a rate limit or an outage at least exits non-zero.
      #
      # Before anything is written, for the same reason the two gates above
      # are: a run that is going to credit nobody should stop while main and
      # the tags are still as they were.
      #
      # Only on the bump path. The assertions are about contributions in this
      # repository's history, and a backfill checks out an older tree where
      # they have not happened yet.
      - name: The notes will say who wrote them
        if: steps.mode.outputs.bump == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/release-notes.test.sh

      - name: Write the version into the tree
        if: steps.mode.outputs.bump == 'true'
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/set-version.sh "${TAG#v}"
          # --tag because the tag does not exist yet: without it everything
          # since the last release lands under an "Unreleased" heading.
          git cliff --tag "$TAG" --output CHANGELOG.md
          git --no-pager diff --stat

      - name: Commit it, tag it, push it
        if: steps.mode.outputs.bump == 'true'
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore(release): ${TAG#v}"

          # The notes go in the tag object as well as on the release page, so
          # somebody reading the history with git alone gets them too.
          #
          # --unreleased rather than --latest, and --tag for the same reason
          # the changelog above needs it: the tag does not exist yet, so
          # "latest" is still the previous release and the tag would carry the
          # wrong version's notes. The sed drops the version heading, which the
          # tag's own name already is.
          #
          # --cleanup=verbatim because the notes are markdown and git's default
          # strips every line beginning with a hash, which is all of the
          # section headings.
          git cliff --tag "$TAG" --unreleased --strip all \
            | sed '0,/^## /{/^## /d}' \
            | git tag -a "$TAG" -F - --cleanup=verbatim

          # Never --force. A merge that landed while this was running should
          # fail the push rather than be overwritten, because CI passed on the
          # commit below it and not on that one.
          git push origin HEAD:main
          git push origin "refs/tags/$TAG"

      - name: The tag this run is for
        id: tag
        env:
          BUMPED: ${{ steps.bump.outputs.tag }}
          REF: ${{ steps.mode.outputs.ref }}
        run: |
          set -euo pipefail
          tag=${BUMPED:-$REF}
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # The section for this tag alone. `--strip all` drops the file's own
      # header and footer; the sed drops the version heading the body template
      # writes, which the release page is already titled with.
      - name: Write the notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git cliff --latest --strip all | sed '0,/^## /{/^## /d}' > NOTES.md
          cat NOTES.md

          # The bytes about to be published, rather than the render the step
          # above checked. This is the only attribution gate a backfill or a
          # pushed tag gets, and it is also the one that would notice the
          # notes going out empty-handed while the changelog looked right.
          if ! grep -qE '^- .*\(@[A-Za-z0-9._-]+\)$' NOTES.md; then
            echo "Not one line of these notes says who wrote it. Publishing" >&2
            echo "them would credit nobody, which is worse than not releasing." >&2
            echo "cliff.toml needs a template that asks GitHub for a handle," >&2
            echo "and this job needs GitHub to answer." >&2
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a release. Leaving its notes alone."
            exit 0
          fi
          # Everything below 1.0 is a pre-release, which is what v0.1.0 and
          # v0.1.1 already say about themselves.
          prerelease=""
          case "$TAG" in v0.*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file NOTES.md \
            $prerelease

  windows:
    name: Windows installer
    runs-on: windows-latest
    needs: release
    outputs:
      signature: ${{ steps.installer.outputs.signature }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # `corepack enable pnpm` and nothing else. `corepack prepare --activate`
      # reads a `packageManager` field this repository does not have, and the
      # runner starts in the root where there is no manifest at all.
      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `--bundles nsis` is not optional: tauri.conf.json pins `targets` to the
      # two Linux ones, and without an override this tries to build a .deb on
      # Windows. The frontend is not built separately either, because
      # `beforeBuildCommand` is already `pnpm build`.
      #
      # This is the only build in this repository that carries an updater, and
      # the only one that signs anything. `--features self-update` compiles the
      # plugin in; the config overlay asks the bundler for the artifacts, which
      # for NSIS means the installer itself plus a detached signature beside it.
      # Both are needed together: the overlay alone would sign an installer
      # whose binary cannot check for an update, and the feature alone would
      # check for one that nothing signed.
      #
      # Neither happens unless the signing key and the public key are both in
      # place. Half a setup produces a plain installer and a warning naming the
      # missing half, rather than a release that cannot be updated from and
      # does not say so. docs/PLAN-self-update.md has what Thomas has to run.
      - name: Build the installer
        id: installer
        working-directory: app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          pubkey=$(node -e 'process.stdout.write(require("./src-tauri/tauri.conf.json").plugins.updater.pubkey)')
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set, so this installer cannot update itself."
            pubkey=PUBLIC_KEY_NOT_SET
          fi
          if [ "$pubkey" = PUBLIC_KEY_NOT_SET ]; then
            echo "::warning::plugins.updater.pubkey is not set, so this installer cannot update itself."
            echo "updating=false" >> "$GITHUB_OUTPUT"
            pnpm tauri build --bundles nsis
            exit 0
          fi
          echo "updating=true" >> "$GITHUB_OUTPUT"
          pnpm tauri build --bundles nsis \
            --features self-update \
            --config src-tauri/tauri.updater.conf.json
          sig="../target/release/bundle/nsis/Consort_${VERSION}_x64-setup.exe.sig"
          test -s "$sig"
          # The signature is one line of base64 and goes into the manifest the
          # job below publishes. It is a signature, not a secret.
          echo "signature=$(cat "$sig")" >> "$GITHUB_OUTPUT"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
          UPDATING: ${{ steps.installer.outputs.updating }}
        shell: bash
        run: |
          set -euo pipefail
          exe="target/release/bundle/nsis/Consort_${VERSION}_x64-setup.exe"
          test -f "$exe"
          gh release upload "$TAG" "$exe" --clobber
          # The .sig too, so the artifact and what vouches for it are in the
          # same place and anybody can check one against the other.
          if [ "$UPDATING" = true ]; then
            gh release upload "$TAG" "${exe}.sig" --clobber
          fi

  # The manifest the installed clients poll.
  #
  # On GitHub Pages rather than as a release asset, and that is not a style
  # choice: `releases/latest/download/` resolves to the newest release that is
  # not a prerelease, every 0.x release here is published `--prerelease`, and so
  # that permalink 404s. Pages gives one URL that no release flag can move.
  #
  # The artifacts stay on the release page, where GitHub documents bandwidth as
  # unmetered. What crosses Pages is under a kilobyte. docs/PLAN-self-update.md
  # has the arithmetic.
  #
  # Nothing is published when the Windows job did not sign anything, because a
  # manifest pointing at an unsigned installer is a manifest every client
  # rejects after downloading it.
  manifest:
    name: Update manifest
    runs-on: ubuntu-latest
    needs: [release, windows]
    if: needs.windows.outputs.signature != ''
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}

      # `site/` is whatever this repository wants on the web, and the manifest
      # is laid on top of it. A Pages deployment replaces the whole site, so
      # building it this way is what keeps a future website and the update path
      # from evicting each other.
      - name: Build the site
        env:
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
          SIGNATURE: ${{ needs.windows.outputs.signature }}
        run: |
          set -euo pipefail
          mkdir -p public/updater
          cp -r site/. public/
          exe="Consort_${VERSION}_x64-setup.exe"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${exe}" \
            --arg signature "$SIGNATURE" \
            '{
               version: $version,
               notes: $notes,
               pub_date: $pub_date,
               platforms: {
                 "windows-x86_64": { url: $url, signature: $signature }
               }
             }' > public/updater/latest.json
          cat public/updater/latest.json

      # The manifest is the thing clients trust to point at the right artifact,
      # so it is checked for being the right shape before it is served rather
      # than after somebody reports that updating stopped working.
      - name: It is the manifest the plugin reads
        run: scripts/manifest.test.sh public/updater/latest.json

      # v6 and v5, not the v5 and v4 most examples show: those still declare
      # `using: node20`, which scripts/node-version.test.sh fails closed on.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: pages
        uses: actions/deploy-pages@v5

  # Named for what they are rather than for the file behind them, because this
  # is what a person watching a release run sees.
  deb:
    name: Debian package
    needs: release
    uses: ./.github/workflows/package-deb.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.release.outputs.tag }}

  arch:
    name: Arch package
    needs: release
    uses: ./.github/workflows/package-arch.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.release.outputs.tag }}
