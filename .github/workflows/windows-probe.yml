# Does this workspace compile on Windows at all?
#
# That is the whole question, and nothing here is meant to survive answering
# it. Consort has never been built for Windows and carries no `cfg(target_os)`
# anywhere, so before writing a release workflow that produces an installer it
# is worth finding out whether the graph even resolves. Three things are
# expected to decide it:
#
#   - `livekit` and `webrtc-sys`, under `consort-call`, which need a prebuilt
#     libwebrtc for the target. If the pinned fork publishes no Windows
#     artefact, this stops here and voice does not go to Windows without
#     upstream work.
#   - `keyring`, whose default features pick the platform credential store. If
#     the Windows one is not among them, a Windows install would quietly put
#     the session in the file fallback, which is a real reduction in protection
#     and would have to be said out loud rather than shipped.
#   - Anything else assuming a Linux path. `renderer.rs` reads
#     `/sys/module/nvidia`, which is simply absent here, so it compiles and
#     correctly does nothing.
#
# `workflow_dispatch` only. It runs when somebody asks and never on a push, so
# it cannot fail a pull request over a platform nothing ships to yet.
#
# The runner is free: GitHub bills no minutes for standard runners on a public
# repository, Windows included. That is only true of the standard ones, so this
# must not be moved to a larger runner.

name: Windows probe

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3
  RUSTUP_MAX_RETRIES: 3
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: cargo check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare --activate

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # `tauri-build` refuses to run without the directory `frontendDist`
      # names, so the frontend has to be built before the Rust half can be
      # looked at. It also answers whether the frontend builds on Windows,
      # which is worth knowing for free.
      - name: Build the frontend
        working-directory: app
        run: pnpm build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `--all-targets` so the tests are compiled too. Platform assumptions
      # hide in test code as readily as anywhere else, and a probe that skipped
      # them would report a green that the real workflow could not reproduce.
      - name: Check
        run: cargo check --workspace --all-targets --locked
