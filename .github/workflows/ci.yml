# Consort CI, on GitHub Actions.
#
# ## Why it lives here and not on Forgejo
#
# It used to be .forgejo/workflows/ci.yml, and Forgejo was the place pull
# requests arrived. GitHub is now that place, and it bills nothing for standard
# runners on a public repository, so there is no reason to run the same jobs
# twice. The Forgejo copy is gone rather than kept in step, and the mirror no
# longer runs CI: it falls back to reading this directory, finds
# `runs-on: ubuntu-latest`, and has no runner carrying that label.
#
# The free tier is only the standard runners. A larger runner is billed on a
# public repository like any other, so nothing here may move to one.
#
# ## Who can make this run
#
# GitHub runs workflows for a first-time contributor's pull request only if the
# repository says so, and the default is "Require approval for first-time
# contributors". Leave it there or tighten it; the setting is under Actions in
# the repository settings, and it is the equivalent of the approval Forgejo
# used to give.
#
# `pull_request_target` is deliberately not used anywhere in this file and
# should not be added. A workflow using it runs an untrusted branch with
# repository secrets in scope.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A failed build should not also cost a fetch of the whole crates.io index.
  CARGO_NET_RETRY: 3
  RUSTUP_MAX_RETRIES: 3
  # Debug info is the bulk of the target directory and nothing here reads a
  # backtrace off a CI machine.
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        # `corepack enable pnpm`, not `corepack prepare --activate`: that reads
        # a `packageManager` field this repository does not have, and fails
        # with a usage error rather than falling back to anything.
        run: corepack enable pnpm

      - name: Install dependencies
        # --frozen-lockfile so a pull request that edits package.json without
        # regenerating the lockfile fails here rather than silently resolving
        # something nobody reviewed.
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # Clean today. Fails on a vulnerability, which on a lockfile that is
        # deliberately frozen is the only way anybody finds out. See
        # docs/DEPENDENCIES.md.
        run: pnpm audit --audit-level=moderate

      - name: Type check
        run: pnpm typecheck

      - name: Test with coverage
        # Thresholds live in vitest.config.ts, so this fails on its own if
        # coverage drops below them.
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  rust:
    name: Rust
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        # webkit2gtk and friends are needed to compile the Tauri crate at all,
        # not just to run it. libssl and pkg-config are for the C half of
        # aws-lc-sys. libasound2-dev is cpal's, and is the one that is easy to
        # leave off: every desktop Linux has the runtime library already, so
        # nothing notices until a machine that only builds tries to.
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsqlite3-dev \
            libssl-dev \
            pkg-config \
            cmake \
            clang

      - name: Toolchain components
        run: rustup component add rustfmt clippy llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: The keyring's zbus is not driven by tokio
        # One zbus in the graph serves both Secret Service and whatever else
        # pulls it in. Its `tokio` feature switches the blocking API over to
        # `block_on`, and the keyring is read from inside an async command, so
        # turning it on panics at startup with "Cannot start a runtime from
        # within a runtime". Nothing catches that but running the application.
        #
        # Resolved into a variable rather than piped straight into grep, so a
        # cargo that failed to answer fails the step instead of reading as a
        # clean graph.
        run: |
          set -euo pipefail
          tree=$(cargo tree --workspace --locked --edges features --invert zbus)
          if printf '%s\n' "$tree" | grep -F 'zbus feature "tokio"'; then
            echo
            echo "Something enabled zbus/tokio. Find it in the tree above and turn that feature off."
            exit 1
          fi
          echo "Not enabled."

      - name: Test
        run: cargo test --workspace

      - name: Coverage
        # There is no keyring daemon in a container, so the secrets backend
        # under test is the file fallback and the keyring adapter is skipped.
        # The exclusions are spelled out in COVERAGE.md; keep the two in step.
        run: |
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --workspace \
            --ignore-filename-regex '(keyring_store\.rs|cpal_host\.rs|consort-call/src/livekit\.rs|src-tauri/src/(main|lib)\.rs)' \
            --fail-under-lines 90 \
            --lcov --output-path lcov.info

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: lcov.info

  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4

      # Its own job rather than a step in the Rust one, because it needs no
      # system libraries and no compiled workspace: it reads Cargo.lock. Run
      # alongside the build rather than after it, so an advisory is reported on
      # a pull request whose tests are still going.
      - name: Cache cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-audit-${{ runner.os }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        # Fails on a vulnerability. Crates that are merely unmaintained,
        # unsound or yanked are reported and do not fail: almost all of them
        # are the GTK3 bindings Tauri brings in, which this project cannot
        # move. docs/DEPENDENCIES.md has what to do when a real one fires, and
        # why an ignore entry has to carry a reason.
        run: cargo audit

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: apt-get update && apt-get install --yes --no-install-recommends git ripgrep

      - name: No em dashes or en dashes
        # House style. They are banned in source, comments, commit messages and
        # docs; a plain hyphen is fine.
        run: |
          if git ls-files -z -- ':!:.claude/**' | xargs -0 rg --no-messages --line-number '[\x{2014}\x{2013}]'; then
            echo
            echo "Found an em dash or en dash. Use a comma, a colon, parentheses, or two sentences."
            exit 1
          fi
          echo "None found."

      - name: No private homeserver names
        # The maintainer's own homeserver has leaked into examples before. The
        # placeholder everywhere is example.org.
        run: |
          if git ls-files -z | xargs -0 rg --no-messages --line-number 'lamp\.stream'; then
            echo
            echo "Use example.org in documentation and tests."
            exit 1
          fi
          echo "None found."

      - name: No stray debugging
        run: |
          if git ls-files -z -- '*.rs' | xargs -0 rg --no-messages --line-number '\bdbg!\(|\bprintln!\("DEBUG'; then
            echo
            echo "Remove the debugging statements."
            exit 1
          fi
          echo "None found."
