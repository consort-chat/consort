# A .deb, for Debian and Ubuntu. Called by release.yml once a tag has a release
# page, and dispatchable on its own to backfill or rebuild a tag.
#
# Built in a bookworm container because the glibc it links against is the oldest
# one it will run on: docs/CI.md#the-glibc-floor-and-the-container-images

name: Debian package

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build a .deb for.
        required: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3
  RUSTUP_MAX_RETRIES: 3

permissions:
  contents: write

jobs:
  deb:
    name: .deb
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm
    env:
      # The clang installed below, rather than the distribution's. Only C++
      # needs it, so gcc stays the C compiler.
      CXX: clang++-21
    defaults:
      run:
        # A job in a container gets `sh`, not bash, whatever the image has in
        # it. On Debian that is dash, which has no `pipefail`, so a step
        # opening with `set -euo pipefail` dies on its first line. The Arch
        # container only escaped it because Arch points /bin/sh at bash.
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: An apt source for a clang new enough for libwebrtc
        # webrtc-sys 0.3.51 refuses anything below clang 21 and bookworm ships
        # 14. The image cannot move: the .deb's glibc floor chose it, which
        # this file's header argues. docs/PLAN-off-the-pinned-forks.md has the
        # floor and where it is read from.
        run: |
          set -euo pipefail
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            -o /etc/apt/keyrings/apt-llvm-org.asc
          echo 'deb [signed-by=/etc/apt/keyrings/apt-llvm-org.asc] http://apt.llvm.org/bookworm/ llvm-toolchain-bookworm-21 main' \
            > /etc/apt/sources.list.d/llvm.list

      - name: System dependencies
        # gh is the last one and is not a build dependency: the runner image
        # has it and this container does not, and the release is uploaded to
        # from in here.
        #
        # Both clangs, for the reason ci.yml's Rust job gives.
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsqlite3-dev \
            libssl-dev \
            pkg-config \
            cmake \
            clang \
            clang-21 \
            gh

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - uses: Swatinem/rust-cache@v2

      # `--bundles deb` is not optional: tauri.conf.json asks for a .rpm as
      # well, and nobody has said where an .rpm would be tested. The frontend
      # is not built separately either, because `beforeBuildCommand` is already
      # `pnpm build`.
      - name: Build the package
        working-directory: app
        run: pnpm tauri build --bundles deb

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Explicit, rather than read off the checkout's git remote, because
          # the remote is an implementation detail of whichever checkout ran.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          deb="target/release/bundle/deb/Consort_${version}_amd64.deb"
          test -f "$deb"
          gh release upload "$TAG" "$deb" --clobber
