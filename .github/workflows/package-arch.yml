# A .pkg.tar.zst, for Arch.
#
# Called by release.yml once a tag has a release page, and dispatchable on its
# own to rebuild one without touching the other packages.
#
# ## Why this checks out the tag, like the other two
#
# It used to check out whatever ref the run started from, on the reasoning that
# this workflow compiles nothing itself: it runs makepkg over
# packaging/arch/PKGBUILD, and that recipe names the commit it builds, as
# `#tag=v$pkgver`, so the only thing needing checking out is the recipe.
#
# That reasoning ignored where the tag comes from. release.yml writes the
# version into the tree, commits, tags and pushes, and only then calls this. A
# called workflow checks out the SHA the run started from, which is main as it
# was before that commit, so the recipe read there is the previous release's
# and the guard below refuses the build. v0.6.0 got no Arch package that way.
#
# The recipe that builds a tag is the one on that tag, so that is what gets
# checked out. The consequence worth knowing: a packaging fix landed on main
# does not reach an already-released tag, and reaches users at the next
# release.
#
# The guard stays, because a tag whose recipe was never updated is still
# possible, and backfilling one released before this file existed would find
# it. The versions are compared before anything is built.
#
# ## Why the tests are skipped
#
# The PKGBUILD's check() runs the workspace test suite in release mode, which
# resolves matrix-sdk a second time for its `testing` feature and so compiles
# the largest thing in the graph twice. A tag points at a commit on main, and
# ci.yml ran those tests on that commit already. Somebody building this
# PKGBUILD by hand still gets check(); only the release build skips it.

name: Arch package

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build a package for.
        required: true

permissions:
  contents: write

jobs:
  pkg:
    name: .pkg.tar.zst
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    defaults:
      run:
        # A job in a container gets `sh`, not bash, whatever the image has in
        # it. On Debian that is dash, which has no `pipefail`, so a step
        # opening with `set -euo pipefail` dies on its first line. The Arch
        # container only escaped it because Arch points /bin/sh at bash.
        shell: bash
    steps:
      # base-devel has the compiler, fakeroot and sudo, and neither git (which
      # both the checkout and the PKGBUILD's source need) nor gh.
      - name: System packages
        run: pacman -Syu --noconfirm --needed git github-cli

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: The recipe is for this tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          recipe=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          if [ "v$recipe" != "$TAG" ]; then
            echo "packaging/arch/PKGBUILD at $TAG builds v$recipe, not $TAG."
            echo "That tag's recipe never took the version. It cannot be packaged."
            exit 1
          fi
          echo "Building v$recipe."

      # makepkg refuses to run as root and the container has nobody else in it.
      # Passwordless sudo is what --syncdeps needs to install the makedepends,
      # and is the standard shape for building a package in a container.
      - name: Somebody for makepkg to be
        run: |
          set -euo pipefail
          useradd --create-home builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chown -R builder: "$GITHUB_WORKSPACE"

      - name: Build the package
        working-directory: packaging/arch
        run: sudo -u builder --set-home makepkg --syncdeps --noconfirm --nocheck

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          pkg="packaging/arch/consort-${version}-1-x86_64.pkg.tar.zst"
          test -f "$pkg"
          gh release upload "$TAG" "$pkg" --clobber
