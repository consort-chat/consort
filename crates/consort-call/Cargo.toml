[package]
name = "consort-call"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# The MatrixRTC facade, behind one `LiveKitCall::join`. Confined to
# `livekit.rs`, which is excluded from coverage because CI has no SFU:
# everything that decides anything sits behind `CallTransport` and is tested
# against a fake.
matrix-rtc-call-sdk = { workspace = true }

# The types `LiveKitCall::publish` takes and returns.
matrix-rtc-transport = { workspace = true }

# `MembershipFormat` for `Dialect`, and `participant_identity`, the
# `{user}:{device}` string `roster.rs` matches a membership on.
matrix-rtc-core = { workspace = true }

# `CallStatus`: a call's end arrives on `LiveKitCall::subscribe_status`.
matrix-rtc-call = { workspace = true }

# The error type `failure.rs` classifies. Adds nothing: the facade links it.
matrix-rtc-livekit = { workspace = true }

# The `Client` and `Room` a join needs, named directly because the workspace pin
# already guarantees one copy.
matrix-sdk = { workspace = true }

# For the `Participant` shape and the room's member store, which names somebody.
# This edge points one way: `consort-matrix` must never depend on this crate, or
# libwebrtc sits in front of every `cargo test -p consort-matrix`.
consort-matrix = { path = "../consort-matrix" }

serde = { workspace = true }

# `StreamExt::next` on a participant's decoded audio. Confined to `livekit.rs`.
futures-util = { workspace = true }

# `Room::subscribe` and `DataPacket`. Confined to `livekit.rs`, and adds
# nothing: the transport already links libwebrtc.
livekit = { workspace = true }

# `consort_call::discovery` parses `.well-known/matrix/client` by hand: ruma's
# typed response is reached over the API base URL and the document lives on the
# server name, which differ the moment a deployment delegates.
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# One test asserts the PCM handed to a publication is the PCM the gate produces,
# and nothing in the type system connects the two.
consort-audio = { path = "../consort-audio" }

# `start_paused`, so the join timeout is proven without a thirty second test.
tokio = { workspace = true, features = ["test-util"] }
