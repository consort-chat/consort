[package]
name = "consort-matrix"
description = "Matrix authentication and session persistence for Consort. No UI, no Tauri."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
matrix-sdk = { workspace = true }
# Only for one error type matrix-sdk does not re-export. See the workspace
# manifest for why naming it directly is safe.
matrix-sdk-base = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Only for the broadcast receiver in `persist_token_refreshes`. The SDK hands
# out a `tokio::sync::broadcast::Receiver`, so naming its error type means
# depending on the same tokio the SDK resolves.
tokio = { workspace = true }
# Room avatars cross the IPC boundary as data URLs, which is base64 by
# definition. Already in the tree by way of the SDK.
base64 = "0.22"
sha2 = "0.10"
# The platform credential store: Secret Service on Linux and the BSDs, the
# Credential Manager on Windows, Keychain on macOS. The `v1` feature (the
# default) is the one that selects a store per platform automatically and
# exposes the flat Entry API; without it the caller has to pick and register a
# store crate by hand.
keyring = "4"
# Only for `install_crypto_provider`. Pinned here rather than in the binary so
# the version cannot drift away from the rustls that matrix-sdk resolves, which
# would put two rustls crates in the graph and make the installed provider apply
# to the wrong one.
rustls = { version = "0.23", features = ["aws_lc_rs"] }

[target.'cfg(windows)'.dependencies]
# Windows ships no SQLite and no import library for one, so the `sqlite` feature
# leaves the linker hunting a file that was never there and the build dies at
# the first cdylib with `LNK1181: cannot open input file 'sqlite3.lib'`. Nothing
# earlier in the build says so: an rlib is not linked, so `cargo build -p
# consort-matrix` passes and the error surfaces against consort-app instead,
# naming a crate that has no SQLite in it.
#
# `bundled-sqlite` compiles the amalgamation with the MSVC toolchain that is
# already a prerequisite, which removes the search rather than satisfying it.
#
# Scoped to Windows rather than set on the workspace dependency because the
# other two platforms have the library, and building a second private copy of
# SQLite into every binary is not a cost they should carry. Features union
# across target sections, so this reaches the final link and changes nothing
# about a Linux or macOS build.
matrix-sdk = { workspace = true, features = ["bundled-sqlite"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
# `testing` brings in MatrixMockServer, which is how login, restore and logout
# get exercised without a homeserver. It is a dev-dependency feature, so with
# resolver 3 it does not leak into `cargo build`: the two feature sets compile
# to separate artifacts that both stay cached.
matrix-sdk = { workspace = true, features = ["testing"] }
wiremock = "0.6"
