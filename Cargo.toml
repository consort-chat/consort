[workspace]
resolver = "3"
members = [
    "crates/consort-audio",
    "crates/consort-call",
    "crates/consort-matrix",
    "crates/consort-video",
    "app/src-tauri",
]

[workspace.package]
version = "0.13.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/consort-chat/consort"
rust-version = "1.97"

# Required by element-hq's workspace, and a downstream workspace has to
# replicate them or the SDK fails to build. Two entries rather than the SDK's
# own three: element-hq drops `zxcvbn`, and so do we.
[patch.crates-io]
async-compat = { git = "https://github.com/element-hq/async-compat", rev = "5a27c8b290f1f1dcfc0c4ec22c464e38528aa591" }
const_panic = { git = "https://github.com/jplatte/const_panic", rev = "e0b317a9a7bde2d48a7d15b6a60d70e4a41d3b5f" }

[workspace.dependencies]
# The Matrix SDK pin.
#
# This rev is NOT arbitrary and MUST NOT be bumped in isolation. It is the rev
# `matrix-rust-rtc` pins for every one of its crates, and this workspace links
# against those crates. If the two revs diverge, cargo resolves two copies of
# matrix-sdk, and the `Client` this workspace builds is a different type from
# the one the call API accepts. The failure is a wall of "expected Client,
# found Client" at the call site, not a version warning.
#
# Bumping means bumping both, together, and rebuilding both.
#
# Upstream `matrix-org`, not a fork. See docs/PLAN-off-the-pinned-forks.md for
# what moving here off the two personal forks cost and what it bought.
matrix-sdk = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "56bc59112822e7eb25943a95e02502855cdeef2d", default-features = false, features = [
    "e2e-encryption",
    "sqlite",
    "rustls-aws-lc-rs",
    "automatic-room-key-forwarding",
    # Turns what somebody typed into the HTML that rides beside it. Nothing
    # here parses markdown itself: ruma decides what counts as formatting and
    # returns nothing at all for text that has none, so a plain sentence stays
    # a plain sentence on the wire.
    "markdown",
] }

# The same rev, resolved from the same git source, so this is the crate
# matrix-sdk itself already links rather than a second copy. Directly named for
# one reason: `matrix_sdk_base::crypto::secret_storage::DecodeError` is the type
# that says whether a recovery key was mistyped or simply not this account's,
# and matrix-sdk exposes the error carrying it without re-exporting the type.
# If the rev above moves, this one moves with it.
matrix-sdk-base = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "56bc59112822e7eb25943a95e02502855cdeef2d", default-features = false, features = [
    "e2e-encryption",
] }

# The MatrixRTC pin, and the reason the one above cannot move on its own.
#
# `LiveKitCall::join` takes a `&matrix_sdk::Room`, so this rev's matrix-sdk pin
# and ours have to be the same string. It is: element-hq pins
# `matrix-org/matrix-rust-sdk@56bc5911` for all three of its SDK crates.
#
# `element-hq`, which is where this work is now maintained. The previous pin
# was `tominal/matrix-rust-rtc`, nine commits on top of
# `BillCarsonFr/matrix-rust-rtc`, which was archived read-only on 20 September
# 2026. Of those nine, six are upstream in some form and three have no home:
# see docs/PLAN-off-the-pinned-forks.md.
#
# The call facade, behind its `matrix-sdk` feature. Without it there is no
# `LiveKitCall` and no join. The feature also drags `matrix-sdk-ui` in for
# `unstable-msc4354`; nothing here uses it.
matrix-rtc-call-sdk = { git = "https://github.com/element-hq/matrix-rust-rtc", rev = "4b3cee57adfd5868eb8ebb3731d9011dfbd6d891", features = [
    "matrix-sdk",
] }

# The transport-level media model, named directly because the types
# `LiveKitCall::publish` takes and returns live here rather than being
# re-exported: `PublishOptions`, `LocalTrackHandle`, `AudioFrame`.
# Same git source and rev, so it is the crate matrix-rtc-call-sdk already links
# rather than a second copy. If the rev above moves, this moves with it.
matrix-rtc-transport = { git = "https://github.com/element-hq/matrix-rust-rtc", rev = "4b3cee57adfd5868eb8ebb3731d9011dfbd6d891" }

# No longer dev-only, which it was when all it carried was `KeyRejection`.
# `MembershipFormat`, `compat::room_state::participant_identity` and
# `LiveKitTransport` all live here, and all three are on the join path.
matrix-rtc-core = { git = "https://github.com/element-hq/matrix-rust-rtc", rev = "4b3cee57adfd5868eb8ebb3731d9011dfbd6d891" }

# `CallStatus`, which is how a call's end is learned now that `CallEvent` has
# no `Ended`, and `ReactionError`, which rides inside `LiveKitCallError`.
matrix-rtc-call = { git = "https://github.com/element-hq/matrix-rust-rtc", rev = "4b3cee57adfd5868eb8ebb3731d9011dfbd6d891" }

# The LiveKit transport implementation rather than the call facade it used to
# be. Named for its error type alone, which `LiveKitCallError::Transport`
# carries and which `failure.rs` has to be able to match on.
matrix-rtc-livekit = { git = "https://github.com/element-hq/matrix-rust-rtc", rev = "4b3cee57adfd5868eb8ebb3731d9011dfbd6d891" }

# Ten crates in Cargo.lock are pinned by hand and are load-bearing.
#
# `livekit`, `livekit-api`, `livekit-datatrack`, `livekit-protocol`,
# `livekit-runtime`, `livekit-signaling`, `libwebrtc`, `webrtc-sys` and
# `webrtc-sys-build` publish semver-compatible releases that do not compile
# with each other. A fresh resolve of the ranges matrix-rtc-livekit asks for
# does not build: `livekit` 0.9.7 fails against `livekit-signaling` 0.1.9,
# whose `SignalOptions` has no `use_legacy_data_streams` field.
#
# The consequence: a bare `cargo update` breaks the build, and the error is a
# type error inside a dependency rather than anything naming a version. If it
# happens, compare against matrix-rust-rtc's Cargo.lock at the rev above and
# pin back to what it holds, parents before children (`livekit` before
# `livekit-api`, `livekit-datatrack` before `livekit-protocol`).
#
# Not expressible here. Cargo has no way to pin a transitive dependency from a
# manifest that does not name it, and naming all of them as direct dependencies
# to get `=` requirements would be a worse lie than the lock is.

# Only for `StreamExt::next` on the `impl Stream` that matrix-sdk hands back
# from `changes()`. Already in the graph by way of matrix-sdk, and no features
# are requested here so cargo unifies the two into one compiled crate rather
# than resolving a second copy.
futures-util = { version = "0.3", default-features = false }

# Named directly only so `consort_call::livekit` can reach `Room::subscribe`
# and `DataPacket`, which `matrix-rtc-livekit` does not re-export. Deafening
# has no representation in MatrixRTC or LiveKit, so Consort clients tell each
# other over the call's own data channel: see `consort_call::notices` for why
# that rather than a participant attribute or a room event.
#
# No features and no default ones, so cargo unifies this with the copy
# matrix-rtc-livekit already asks for rather than resolving a second one. The
# version range is deliberately the same `^0.7` that crate uses: the exact
# build is decided by the hand-pinned Cargo.lock entry above, and restating it
# here as `=` would put the pin in two places that could disagree.
livekit = { version = "0.9", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# libwebrtc arrives with the voice layer and makes debug symbols enormous.
# Stripping keeps the shipped binary something a person will actually download.
strip = true
# Thin LTO is the cheap part of the size win and stays.
lto = "thin"

# `codegen-units = 1` is deliberately NOT set here.
#
# It compiles each crate as one LLVM module instead of sixteen that build in
# parallel, so peak rustc memory scales with the whole crate rather than a
# slice. On matrix-sdk that is gigabytes, and cargo builds several such crates
# at once: measured on a 30 GB machine it produced three simultaneous
# multi-gigabyte rustc processes and exhausted a 15 GB swap file.
#
# Measured on this workspace it is worth 33 MB of binary against 40 MB, so
# roughly 21%. Real, but not worth making the project hostile to build for: the
# packaged .deb is 16 MB either way once compressed, and libwebrtc lands with
# the voice layer and is larger than matrix-sdk.
#
# If binary size ever does matter, `codegen-units = 4` recovers most of the
# difference at a quarter of the peak memory. Do not go to 1.

[profile.dev]
# Full debuginfo is the reason a dev build peaks at four simultaneous ld.lld
# processes holding ~2.2 GB each. `line-tables-only` keeps the part backtraces
# actually use, file and line numbers, and drops the type and variable DWARF
# that makes up the bulk of the object files.
debug = "line-tables-only"
# Leave debuginfo in the .o files instead of copying it into the linked binary.
# The linker stops rewriting hundreds of megabytes of DWARF on every rebuild,
# which is where most of the ld.lld memory and wall-clock went. Backtraces and
# gdb still resolve, they read the .o files in the target dir.
split-debuginfo = "unpacked"

[profile.dev.package."*"]
# Dependencies get rebuilt almost never but are relinked constantly, and their
# debuginfo is not something anyone steps through. Dropping it entirely shrinks
# the target dir and the link set without costing anything in our own crates.
debug = false

# A 720p MJPEG frame is a JPEG decode and then a per-pixel conversion, and at
# opt-level 0 that is 159 ms of CPU each: 5.5 frames a second out of a camera
# offering 30, with one core held at 100%. See docs/PERFORMANCE.md.
[profile.dev.package.consort-video]
opt-level = 2

# The larger half of that frame, and a dependency, so the block above reaches
# its debuginfo rather than its speed.
[profile.dev.package.zune-jpeg]
opt-level = 2
