[workspace]
resolver = "3"
members = [
    "crates/consort-audio",
    "crates/consort-call",
    "crates/consort-matrix",
    "crates/consort-video",
    "app/src-tauri",
]

[workspace.package]
version = "0.14.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/consort-chat/consort"
rust-version = "1.97"

[workspace.dependencies]
# Must stay the exact rev matrix-rust-rtc pins, or cargo resolves two
# matrix-sdks and the `Client` built here stops being the type the call API
# accepts. Never bump it alone: docs/DEPENDENCIES.md
matrix-sdk = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "56bc59112822e7eb25943a95e02502855cdeef2d", default-features = false, features = [
    "e2e-encryption",
    "sqlite",
    "rustls-aws-lc-rs",
    "automatic-room-key-forwarding",
    # Nothing here parses markdown: ruma decides what counts as formatting and
    # returns nothing for text that has none.
    "markdown",
] }

# Named directly only for
# `matrix_sdk_base::crypto::secret_storage::DecodeError`, which matrix-sdk does
# not re-export. Same git source and rev, so the same crate.
matrix-sdk-base = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "56bc59112822e7eb25943a95e02502855cdeef2d", default-features = false, features = [
    "e2e-encryption",
] }

# The call facade behind its `matrix-sdk` feature: without it there is no
# `LiveKitCall` and no join. This rev's matrix-sdk pin and ours must be the same
# string: docs/DEPENDENCIES.md
matrix-rtc-call-sdk = { git = "https://github.com/element-hq/matrix-rust-rtc", rev = "4b3cee57adfd5868eb8ebb3731d9011dfbd6d891", features = [
    "matrix-sdk",
] }

# The types `LiveKitCall::publish` takes and returns live here rather than being
# re-exported.
matrix-rtc-transport = { git = "https://github.com/element-hq/matrix-rust-rtc", rev = "4b3cee57adfd5868eb8ebb3731d9011dfbd6d891" }

# No longer dev-only, which it was when all it carried was `KeyRejection`.
# `MembershipFormat`, `compat::room_state::participant_identity` and
# `LiveKitTransport` all live here, and all three are on the join path.
matrix-rtc-core = { git = "https://github.com/element-hq/matrix-rust-rtc", rev = "4b3cee57adfd5868eb8ebb3731d9011dfbd6d891" }

# `CallStatus`, which is how a call's end is learned now that `CallEvent` has
# no `Ended`, and `ReactionError`, which rides inside `LiveKitCallError`.
matrix-rtc-call = { git = "https://github.com/element-hq/matrix-rust-rtc", rev = "4b3cee57adfd5868eb8ebb3731d9011dfbd6d891" }

# Named for its error type alone, which `LiveKitCallError::Transport` carries
# and `failure.rs` matches on.
matrix-rtc-livekit = { git = "https://github.com/element-hq/matrix-rust-rtc", rev = "4b3cee57adfd5868eb8ebb3731d9011dfbd6d891" }

# Nine livekit and webrtc crates are pinned by hand in Cargo.lock: they publish
# semver-compatible releases that do not compile with each other, and a bare
# `cargo update` breaks the build. docs/DEPENDENCIES.md has the list and the
# order.

# Only for `StreamExt::next` on the stream `changes()` hands back. No features,
# so cargo unifies it with matrix-sdk's copy.
futures-util = { version = "0.3", default-features = false }

# Named only so `consort_call::livekit` can reach `Room::subscribe` and
# `DataPacket`, which `matrix-rtc-livekit` does not re-export. No features, so
# cargo unifies it with that crate's copy; the exact build is the Cargo.lock
# pin.
livekit = { version = "0.9", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# libwebrtc makes debug symbols enormous.
strip = true
lto = "thin"

# codegen-units = 1 is deliberately not set: gigabytes of peak rustc memory for
# 21% of binary. docs/BUILDING.md

[profile.dev]
# Backtraces keep file and line; the type DWARF is what made links heavy.
debug = "line-tables-only"
# Debuginfo stays in the .o files so the linker stops rewriting it.
split-debuginfo = "unpacked"

[profile.dev.package."*"]
# Dependencies are relinked constantly and nobody steps through them.
debug = false

# A 720p MJPEG frame decodes at 5.5 frames a second at opt-level 0.
# See docs/PERFORMANCE.md.
[profile.dev.package.consort-video]
opt-level = 2

# The larger half of that frame, and a dependency, so the block above reaches
# its debuginfo rather than its speed.
[profile.dev.package.zune-jpeg]
opt-level = 2
